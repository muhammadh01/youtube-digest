server {
    listen 80;
    server_name api.durak.dev durak.dev prometheus.durak.dev grafana.durak.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.durak.dev;

    ssl_certificate /etc/letsencrypt/live/api.durak.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.durak.dev/privkey.pem;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name durak.dev;

    ssl_certificate /etc/letsencrypt/live/api.durak.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.durak.dev/privkey.pem;

    location / {
        proxy_pass http://web:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    server_name prometheus.durak.dev;

    ssl_certificate /etc/letsencrypt/live/api.durak.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.durak.dev/privkey.pem;

    location / {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name grafana.durak.dev;

    ssl_certificate /etc/letsencrypt/live/api.durak.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.durak.dev/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}