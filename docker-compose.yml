services:
  nginx:
    image: nginx:alpine
    container_name: youtube-digest-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    container_name: youtube-digest-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  api:
    build: .
    image: youtube-digest:0.3
    container_name: youtube-digest-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
    depends_on:
      - redis
      - ollama

  redis:
    image: redis:7-alpine
    container_name: youtube-digest-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
  
  web:
    build: ./web
    container_name: youtube-digest-web
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    container_name: youtube-digest-ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  redis-data:
  ollama-data:
